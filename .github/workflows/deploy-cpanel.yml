name: Deploy (cPanel via FTPS)

# Deploy otomatis ke cPanel setiap CI di `main` selesai sukses.
# Memakai explicit FTPS (TLS port 21) dan upload aditif tanpa flag delete,
# sehingga file .env, folder storage, dan aturan routing .htaccess yang ada di server tetap aman.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

env:
  API_BASE_URL: ${{ vars.CPANEL_API_BASE_URL || 'https://jejaka500.followtheline.id/api' }}
  PUBLIC_URL: ${{ vars.CPANEL_PUBLIC_URL || 'https://jejaka500.followtheline.id' }}

jobs:
  deploy:
    name: Build & deploy ke cPanel (FTPS)
    if: |
      vars.CPANEL_FTP_HOST != '' &&
      (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') && (
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, exif, gd, zip, opcache
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Composer dependencies (production)
        working-directory: backend
        run: composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader

      - name: Install Node dependencies (backend assets)
        working-directory: backend
        run: npm ci

      - name: Dump optimized autoloader
        working-directory: backend
        run: composer dump-autoload --no-dev --optimize --no-scripts

      - name: Generate Wayfinder routes + Vite build
        working-directory: backend
        env:
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          php artisan wayfinder:generate --with-form
          npm run build

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node cache for frontend
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_BASE_URL }}
        run: pnpm run build

      - name: Verify script unit tests
        run: python3 .github/scripts/test_ftps_deploy.py

      - name: Deploy backend (FTPS -> /api)
        env:
          CPANEL_FTP_HOST: ${{ vars.CPANEL_FTP_HOST }}
          CPANEL_FTP_PORT: ${{ vars.CPANEL_FTP_PORT || '21' }}
          CPANEL_FTP_USERNAME: ${{ vars.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: python3 .github/scripts/ftps_deploy.py backend /api

      - name: Deploy frontend (FTPS -> /)
        env:
          CPANEL_FTP_HOST: ${{ vars.CPANEL_FTP_HOST }}
          CPANEL_FTP_PORT: ${{ vars.CPANEL_FTP_PORT || '21' }}
          CPANEL_FTP_USERNAME: ${{ vars.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: python3 .github/scripts/ftps_deploy.py frontend/dist /

      - name: Smoke test
        run: |
          set -euo pipefail
          check_url() {
            local path="$1"
            local expected="$2"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL}${path}" || true)
            echo "${path} -> ${code}"
            [ "$code" = "$expected" ]
          }

          for i in 1 2 3 4 5; do
            if check_url "/up" 200 && check_url "/" 200 && check_url "/api/price-categories" 200; then
              exit 0
            fi
            echo "smoke test retry $i"
            sleep 10
          done
          echo "Smoke test cPanel gagal setelah 5 percobaan"; exit 1
