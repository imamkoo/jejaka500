name: Deploy (cPanel via FTPS)

# Deploy otomatis ke cPanel setiap CI di `main` selesai sukses.
# Memakai explicit FTPS (TLS port 21) dan upload aditif tanpa flag delete,
# sehingga file .env, folder storage, dan aturan routing .htaccess yang ada di server tetap aman.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_upload:
        description: Upload all files even when the remote manifest marks them unchanged
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

env:
  API_BASE_URL: ${{ vars.CPANEL_API_BASE_URL || 'https://jejaka500.followtheline.id/api' }}
  PUBLIC_URL: ${{ vars.CPANEL_PUBLIC_URL || 'https://jejaka500.followtheline.id' }}

jobs:
  deploy:
    name: Build & deploy ke cPanel (FTPS)
    if: |
      vars.CPANEL_FTP_HOST != '' && (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        ) || (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Preflight cPanel credentials
        env:
          CPANEL_DEPLOY_TOKEN: ${{ secrets.CPANEL_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_DEPLOY_TOKEN:-}" ]; then
            echo "::error::CPANEL_DEPLOY_TOKEN belum diisi di Settings -> Secrets and variables -> Actions."
            echo "Buat token di server lewat Terminal cPanel:"
            echo "  php ~/followtheline.id/jejaka500/api/public/deploy-token.php"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, exif, gd, zip, opcache
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Composer dependencies (production)
        working-directory: backend
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          # Dokumentasi vendor tidak dipakai saat runtime dan menambah ribuan file.
          find vendor -type d -name docs -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Install Node dependencies (backend assets)
        working-directory: backend
        run: npm ci

      - name: Dump optimized autoloader
        working-directory: backend
        run: composer dump-autoload --no-dev --optimize

      - name: Generate Wayfinder routes + Vite build
        working-directory: backend
        env:
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          php artisan wayfinder:generate --with-form
          npm run build

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node cache for frontend
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_BASE_URL }}
        run: pnpm run build

      - name: Verify deployment and Service Worker tests
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          node --test frontend/scripts/test-sw-denylist.mjs

      - name: Package backend archive
        run: |
          python3 .github/scripts/build_archive.py backend "$RUNNER_TEMP/backend.zip" "$RUNNER_TEMP/backend-manifest.json"

      - name: Deploy backend (chunked HTTPS -> /api)
        env:
          CPANEL_DEPLOY_TOKEN: ${{ secrets.CPANEL_DEPLOY_TOKEN }}
          CPANEL_DEPLOY_ENDPOINT: ${{ vars.CPANEL_DEPLOY_ENDPOINT || 'https://jejaka500.followtheline.id/api/deploy-extract.php' }}
        run: |
          python3 .github/scripts/upload_chunks.py "$RUNNER_TEMP/backend-manifest.json"

      - name: Package frontend archive
        run: |
          python3 .github/scripts/build_archive.py frontend/dist "$RUNNER_TEMP/spa.zip" "$RUNNER_TEMP/spa-manifest.json"

      - name: Deploy frontend (chunked HTTPS -> /)
        env:
          CPANEL_DEPLOY_TOKEN: ${{ secrets.CPANEL_DEPLOY_TOKEN }}
          CPANEL_DEPLOY_ENDPOINT: ${{ vars.CPANEL_DEPLOY_ENDPOINT || 'https://jejaka500.followtheline.id/api/deploy-extract.php' }}
        run: |
          python3 .github/scripts/upload_chunks.py "$RUNNER_TEMP/spa-manifest.json"

      - name: Smoke test
        run: |
          set -euo pipefail
          check_url() {
            local path="$1"
            local expected="$2"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL}${path}" || true)
            echo "${path} -> ${code}"
            [ "$code" = "$expected" ]
          }

          for i in 1 2 3 4 5; do
            if check_url "/up" 200 && check_url "/" 200 && check_url "/api/price-categories" 200 && check_url "/admin/login" 200; then
              exit 0
            fi
            echo "smoke test retry $i"
            sleep 10
          done
          echo "Smoke test cPanel gagal setelah 5 percobaan"; exit 1
