name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Quality (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Security audit — composer (blocking)
        run: composer audit --locked

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate App Key
        run: php artisan key:generate

      - name: Install Node Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Run Pint (Code Style Check)
        run: ./vendor/bin/pint --test

      - name: Run Backend Tests
        run: ./vendor/bin/pest

  backend-mysql:
    name: Backend Tests (MySQL portability)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jejaka500_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: jejaka500_test
      DB_USERNAME: root
      DB_PASSWORD: root
      EXPECT_DB_DRIVER: mysql

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, exif, gd, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate App Key
        run: php artisan key:generate

      - name: Install Node Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Run Backend Tests on MySQL
        run: ./vendor/bin/pest

  frontend:
    name: Frontend Quality (React SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit — pnpm (blocking, critical)
        run: pnpm audit --prod --audit-level critical

      - name: Lint Check
        run: pnpm run lint

      - name: Build SPA
        run: pnpm run build

  deploy-tooling:
    name: Deploy Tooling Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Tanpa PHP, tes yang mengeksekusi handler (`deploy-lib.php`) akan
      # ter-skip diam-diam dan kesalahan pemetaan tujuan lolos ke produksi.
      # `zip` wajib: alur ekstraksi memakai `ZipArchive`, sama seperti server.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Verify PHP prerequisites are present
        run: |
          set -euo pipefail
          php -r 'if (! class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive tidak tersedia\n"); exit(1); }'
          php -v | head -1

      - name: Run deploy tooling tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      # Tes PHP harus benar-benar dieksekusi, bukan ter-skip.
      - name: Fail when PHP behaviour tests were skipped
        run: |
          set -euo pipefail
          output=$(python3 -m unittest discover -s .github/scripts -p 'test_*.py' 2>&1)
          if grep -q "skipped 'ekstensi zip PHP" <<<"$output"; then
            echo "::error::Tes ekstraksi ter-skip: ekstensi zip PHP tidak terpasang."
            exit 1
          fi
          echo "$output" | tail -3
