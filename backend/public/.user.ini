; Batas upload PHP untuk cPanel.
;
; Endpoint deploy (`deploy-extract.php`) mengirim arsip dalam potongan 4 MiB,
; jadi `upload_max_filesize` cukup 8M. Tanpa berkas ini cPanel memakai default
; yang lebih kecil (sering 2M) dan unggahan potongan ditolak dengan 413.
;
; `post_max_size` harus >= `upload_max_filesize` ditambah overhead multipart.

upload_max_filesize = 8M
post_max_size = 10M
